  <!-- Firebase Module Bridge (Connects Firebase v10 to React cleanly on Vercel) -->
  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyDiJqktDmZCNo_bvQOu7GrrksZMm5XrYKM",
      authDomain: "prompt-wash-arena.firebaseapp.com",
      projectId: "prompt-wash-arena",
      storageBucket: "prompt-wash-arena.firebasestorage.app",
      messagingSenderId: "1034784979973",
      appId: "1:1034784979973:web:db659e7180b7b95159706c",
      measurementId: "G-1YHS646QSX"
    };

    window.FB_BRIDGE = {
      ready: false,
      signInGoogle: null,
      signOutUser: null,
      syncScore: null,
      ensureUserDoc: null
    };

    (async function () {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
        const { getAnalytics, isSupported } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js");
        const { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
        const { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, increment, collection, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");

        const app = initializeApp(firebaseConfig);
        isSupported().then((yes) => { if (yes) getAnalytics(app); }).catch(() => {});

        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });

        window.FB_BRIDGE.ready = true;
        window.FB_BRIDGE.signInGoogle = () => signInWithPopup(auth, provider);
        window.FB_BRIDGE.signOutUser = () => signOut(auth);

        window.FB_BRIDGE.ensureUserDoc = async (uObj, prof) => {
          if (!uObj || !uObj.uid) return prof;
          const ref = doc(db, "students", uObj.uid);
          const snap = await getDoc(ref);
          if (!snap.exists()) {
            await setDoc(ref, {
              name: uObj.displayName || prof.name || "Student",
              email: uObj.email || prof.email || "",
              score: prof.score || 0,
              learnScore: prof.learnScore || 0,
              codeScore: prof.codeScore || 0,
              solvedIds: prof.solvedIds || []
            });
            return prof;
          } else {
            const d = snap.data();
            const merged = Object.assign({}, prof, {
              score: Math.max(prof.score || 0, d.score || 0),
              learnScore: Math.max(prof.learnScore || 0, d.learnScore || 0),
              codeScore: Math.max(prof.codeScore || 0, d.codeScore || 0)
            });
            return merged;
          }
        };

        window.FB_BRIDGE.syncScore = async (uObj, itemId, pts, categoryType, prof) => {
          if (!uObj || !uObj.uid) return;
          const ref = doc(db, "students", uObj.uid);
          const payload = {
            name: uObj.displayName || "Student",
            email: uObj.email || "",
            score: increment(pts),
            solvedIds: arrayUnion(itemId)
          };
          if (categoryType === "learn") payload.learnScore = increment(pts);
          if (categoryType === "code") payload.codeScore = increment(pts);
          try {
            await updateDoc(ref, payload);
          } catch (_) {
            await setDoc(ref, {
              name: uObj.displayName || "Student",
              email: uObj.email || "",
              score: prof.score || pts,
              learnScore: prof.learnScore || 0,
              codeScore: prof.codeScore || 0,
              solvedIds: prof.solvedIds || [itemId]
            });
          }
        };

        onAuthStateChanged(auth, (fbUser) => {
          window.dispatchEvent(new CustomEvent("fb-auth-changed", { detail: fbUser }));
        });

        onSnapshot(collection(db, "students"), (snap) => {
          const rows = [];
          snap.forEach((d) => rows.push(Object.assign({ id: d.id }, d.data())));
          window.dispatchEvent(new CustomEvent("fb-lb-changed", { detail: rows }));
        }, () => {});
      } catch (e) {
        console.warn("Firebase init notice:", e);
      }
    })();
  </script>

                          return (
                            <tr key={r.id || idx} className={isMe ? "me-row" : ""}>
                              <td>#{idx + 1}</td>
                              <td>{r.name || "Student"} {isMe && <span className="badge badge-easy">You (Signed In ✓)</span>}</td>
                              <td><strong>{r.score || 0} pts</strong></td>
                              <td>{r.learnScore || 0} pts</td>
                              <td>{r.codeScore || 0} pts</td>
                            </tr>
                          );
                        });
                    })()}
                  </tbody>
                </table>
              </section>
            )}

            {/* ==================== 10. CERTIFICATIONS ==================== */}
            {activePage === "certified" && (
              <section>
                <h2 style={{ marginBottom: "0.8rem" }}>225+ Free <span className="gradient-text">Certifications</span></h2>
                <div className="single-col-list">
                  {(window.CERTIFICATION_CATALOG || [
                    { id: "c1", provider: "freeCodeCamp", category: "Programming", courseTitle: "JavaScript Algorithms and Data Structures", url: "https://www.freecodecamp.org" },
                    { id: "c2", provider: "Google Cloud", category: "AI & ML", courseTitle: "Introduction to Generative AI", url: "https://www.cloudskillsboost.google" }
                  ]).slice(0, 25).map((c) => (
                    <div key={c.id} className="single-row-item">
                      <div>
                        <span className="badge badge-info">{c.provider} • {c.category}</span>
                        <h4 style={{ marginTop: "0.2rem" }}>{c.courseTitle}</h4>
                      </div>
                      <a href={c.url} target="_blank" rel="noreferrer" className="btn-primary">Go to Course ↗</a>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* ==================== 11. MY CERTS ==================== */}
            {activePage === "mycerts" && (
              <section>
                <h2 style={{ marginBottom: "0.8rem" }}>My <span className="gradient-text">Certificates &amp; LinkedIn AI</span></h2>
                {!user ? (
                  <div className="card" style={{ borderColor: "#f59e0b", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span>🔒 Please <b>Sign in</b> to view or upload your personal certificates.</span>
                    <button className="btn-primary" onClick={() => setShowSignInModal(true)}>Sign in</button>
                  </div>
                ) : (
                  <div className="card">
                    <p style={{ fontSize: "0.85rem", color: "var(--text-muted)" }}>
                      Signed in as <b>{user.displayName}</b> — Saved Certificates: {profile.uploadedCerts.length}
                    </p>
                  </div>
                )}
              </section>
            )}

            {/* ==================== 12. MY ACTIVITY ==================== */}
            {activePage === "vault" && (
              <section>
                <h2 style={{ marginBottom: "0.8rem" }}>My <span className="gradient-text">Activity &amp; Score Dashboard</span></h2>
                {!user ? (
                  <div className="card" style={{ borderColor: "#f59e0b", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span>🔒 You are currently signed out. Sign in to view your personal points, solved code, and quiz history!</span>
                    <button className="btn-primary" onClick={() => setShowSignInModal(true)}>Sign in</button>
                  </div>
                ) : (
                  <>
                    <div className="stats-strip">
                      <div className="stat-card"><div className="stat-val gradient-text">{profile.score} pts</div><div>Total Score</div></div>
                      <div className="stat-card"><div className="stat-val gradient-text">{profile.quizzesAttended.length}</div><div>Quizzes Scored</div></div>
                      <div className="stat-card"><div className="stat-val gradient-text">{profile.solvedPrograms.length}</div><div>Code Programs</div></div>
                      <div className="stat-card"><div className="stat-val gradient-text">{profile.topicsLearned.length}</div><div>Topics Completed</div></div>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1rem" }}>
                      <div className="card">
                        <div style={{ display: "flex", gap: "0.4rem", marginBottom: "0.7rem" }}>
                          <button className={activityTab === "quizzes" ? "btn-primary" : "btn-secondary"} onClick={() => setActivityTab("quizzes")}>Quizzes</button>
                          <button className={activityTab === "code" ? "btn-primary" : "btn-secondary"} onClick={() => setActivityTab("code")}>Code</button>
                        </div>
                        <div className="fixed-pane-scroll">
                          {activityTab === "quizzes" && profile.quizzesAttended.map((q, i) => (
                            <div key={i} className="single-row-item" onClick={() => setInspectedItem(q)} style={{ cursor: "pointer" }}>
                              <span>{q.title}</span>
                              <span className="badge badge-easy">+{q.points} pts</span>
                            </div>
                          ))}
                          {activityTab === "code" && profile.solvedPrograms.map((sp, i) => (
                            <div key={i} className="single-row-item" onClick={() => setInspectedItem(sp)} style={{ cursor: "pointer" }}>
                              <span>💻 {sp.title}</span>
                              <span className="badge badge-info">{sp.lang}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                      <div className="card">
                        <strong style={{ color: "#34d399" }}>🔍 Inspector</strong>
                        {inspectedItem ? (
                          <div style={{ marginTop: "0.6rem" }}>
                            <h4>{inspectedItem.title}</h4>
                            {inspectedItem.code && <pre className="code-block"><code>{inspectedItem.code}</code></pre>}
                          </div>
                        ) : (
                          <p style={{ fontSize: "0.84rem", color: "var(--text-muted)", marginTop: "0.5rem" }}>Click any item on the left to inspect it.</p>
                        )}
                      </div>
                    </div>
                  </>
                )}
              </section>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
